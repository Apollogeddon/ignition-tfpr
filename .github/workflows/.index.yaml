name: Index

on:
  push:
    branches:
      - main
    paths:
      - go.mod
      - go.sum
      - main.go
      - 'internal/**'
      - '.forgego/**'
      - '.golangci*.yml'
      - Taskfile.yml
      - docker-compose.yml
      - '.github/workflows/.index.yaml'
      - '.github/workflows/ignition.yaml'
      - '.github/workflows/release.yaml'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# each job asks for what it needs
permissions:
  contents: read

jobs:
  # What a pull request needs: the provider's pipeline when its code, its tooling or the
  # workflows that test and release it changed, and shellcheck when a script changed.
  # The webpage and the Dependabot merge run on every pull request.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
      scripts: ${{ steps.diff.outputs.scripts }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find what changed
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          CODE_INPUTS: '^(go\.(mod|sum)$|main\.go$|internal/|\.forgego/|\.golangci.*\.yml$|Taskfile\.yml$|docker-compose\.yml$|\.github/workflows/(\.index|ignition|release)\.yaml$)'
          SCRIPT_INPUTS: '(\.sh$|^\.github/workflows/\.index\.yaml$)'
        run: |
          # a push or a manual run releases, so it runs the whole pipeline
          if [ "$EVENT" != pull_request ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "scripts=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE" HEAD)
          printf '%s\n' "$files"
          if printf '%s\n' "$files" | grep -qE "$CODE_INPUTS"; then code=true; else code=false; fi
          if printf '%s\n' "$files" | grep -qE "$SCRIPT_INPUTS"; then scripts=true; else scripts=false; fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"
          echo "scripts=$scripts" | tee -a "$GITHUB_OUTPUT"

  shellcheck:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # pinned, as the runner's shellcheck version changes what it reports
      - name: Install shellcheck
        env:
          VERSION: v0.11.0
        run: |
          curl -sSfL "https://github.com/koalaman/shellcheck/releases/download/$VERSION/shellcheck-$VERSION.linux.x86_64.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP" --strip-components=1 "shellcheck-$VERSION/shellcheck"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck

  # forgego's lint, tidy, govulncheck and OSV checks, the unit tests and the build.
  # Gitleaks runs in webpage.yaml, over the whole repository.
  testing:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: apollogeddon/forgego/.github/workflows/testing.yml@main
    with:
      enable_secrets: false
    secrets: inherit
    # its patch job commits on main
    permissions:
      contents: write

  trivy:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          exit-code: '1'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          # the provider's own modules: .forgego/ pins dev tools that never ship, and
          # webpage.yaml checks the site's dependencies
          skip-dirs: '.forgego,webpage'

  ignition:
    needs: [testing, trivy]
    uses: ./.github/workflows/ignition.yaml
    secrets: inherit

  release:
    needs: ignition
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/release.yaml
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      # then rebuilds the webpage, which installs @apollogeddon/forgejs from GitHub Packages
      packages: read
      pages: write
      id-token: write

  # pull requests only: on main, webpage.yaml runs on its own push trigger
  webpage:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/webpage.yaml
    permissions:
      contents: read
      # the webpage installs @apollogeddon/forgejs from GitHub Packages
      packages: read
      # Gitleaks comments on the pull request when it finds a secret
      pull-requests: write
      pages: write
      id-token: write

  # CODEOWNERS doesn't request a review on a bot's pull request, so Dependabot's asks here
  review:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    uses: apollogeddon/forgego/.github/workflows/review.yml@main
    permissions:
      pull-requests: write

  # last, so a Dependabot pull request merges only once every check above has passed
  auto-merge:
    needs: [shellcheck, ignition, webpage]
    if: ${{ !failure() && !cancelled() && github.event_name == 'pull_request' }}
    uses: apollogeddon/forgego/.github/workflows/merge.yml@main
    permissions:
      contents: write
      pull-requests: write
