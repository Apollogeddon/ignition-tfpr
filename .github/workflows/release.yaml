name: Release

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # forgego's release-please, with .github/release.json; it also requests the review of
  # the release pull request it opens, which the workflow token's pull request can't start
  version:
    uses: apollogeddon/forgego/.github/workflows/version.yml@main
    permissions:
      contents: write
      pull-requests: write

  publish:
    needs: version
    if: needs.version.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Import GPG Key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      # release-please created the release as a draft; GoReleaser attaches the
      # signed files and publishes it
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}

  # The site serves the provider network mirror. Its push-triggered build ran before
  # GoReleaser attached this release's files, so build and deploy it again now.
  webpage:
    needs: publish
    uses: ./.github/workflows/webpage.yaml
    permissions:
      contents: read
      packages: read
      pull-requests: write
      pages: write
      id-token: write
